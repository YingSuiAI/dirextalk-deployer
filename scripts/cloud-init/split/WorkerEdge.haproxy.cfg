# deployment_region=__DIREXTALK_WORKER_EDGE_REGION__
# s2_region=__DIREXTALK_WORKER_EDGE_S2_REGION__
# route_mode=__DIREXTALK_WORKER_EDGE_ROUTE_MODE__
# listen_ip=__DIREXTALK_WORKER_EDGE_LISTEN_IP__
# evidence_sha256=__DIREXTALK_WORKER_EDGE_EVIDENCE_SHA256__
# run_id=__DIREXTALK_WORKER_EDGE_RUN_ID__
# account_id=__DIREXTALK_WORKER_EDGE_ACCOUNT_ID__
# owner_id=__DIREXTALK_WORKER_EDGE_OWNER_ID__
# account_generation=__DIREXTALK_WORKER_EDGE_ACCOUNT_GENERATION__
# lightsail_instance_arn=__DIREXTALK_WORKER_EDGE_LIGHTSAIL_INSTANCE_ARN__
# edge_instance_id=__DIREXTALK_WORKER_EDGE_INSTANCE_ID__
# edge_eip_allocation_id=__DIREXTALK_WORKER_EDGE_EIP_ALLOCATION_ID__
# edge_eip_association_id=__DIREXTALK_WORKER_EDGE_EIP_ASSOCIATION_ID__
# private_hosted_zone_id=__DIREXTALK_WORKER_EDGE_PRIVATE_HOSTED_ZONE_ID__
# public_hosted_zone_id=__DIREXTALK_WORKER_EDGE_PUBLIC_HOSTED_ZONE_ID__
# worker_security_group_id=__DIREXTALK_WORKER_SECURITY_GROUP_ID__
# edge_security_group_id=__DIREXTALK_WORKER_EDGE_SECURITY_GROUP_ID__

global
    log stdout format raw local0

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client  1m
    timeout server  1m

frontend dirextalk_tls_front
    bind __DIREXTALK_WORKER_EDGE_LISTEN_IP__:443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    acl worker_control req.ssl_sni -i __DIREXTALK_WORKER_CONTROL_DOMAIN__
    acl model_relay req.ssl_sni -i __DIREXTALK_MODEL_RELAY_DOMAIN__
    acl outbound_proxy req.ssl_sni -i __DIREXTALK_OUTBOUND_PROXY_DOMAIN__
    tcp-request content reject unless worker_control or model_relay or outbound_proxy
    use_backend worker_control_tls if worker_control
    use_backend model_relay_tls if model_relay
    use_backend outbound_proxy_tls if outbound_proxy

backend worker_control_tls
    server worker_control __DIREXTALK_WORKER_CONTROL_UPSTREAM__

backend model_relay_tls
    server model_relay __DIREXTALK_MODEL_RELAY_UPSTREAM__

backend outbound_proxy_tls
    server outbound_proxy __DIREXTALK_OUTBOUND_PROXY_UPSTREAM__
