name: ${DIREXTALK_WORKER_EDGE_STACK_NAME:?set a unique Worker edge stack name}

# Optional Agent Cloud Worker edge.  It is intentionally not included in the
# normal bootstrap until the deployment has immutable HAProxy provenance,
# exact Agent listener bindings, DNS, and private/public network evidence.
services:
  worker-controlled-proxy:
    image: ${DIREXTALK_WORKER_EDGE_PROXY_IMAGE_IMMUTABLE:?set the immutable reviewed Squid Alpine image reference}
    entrypoint: ["squid"]
    command: ["-N", "-f", "/etc/squid/squid.conf"]
    network_mode: host
    restart: unless-stopped
    read_only: true
    user: "0:0"
    cap_drop: ["ALL"]
    cap_add: ["SETUID", "SETGID", "DAC_READ_SEARCH"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /run:rw,noexec,nosuid,nodev,mode=0755
      - /var/log/squid:rw,noexec,nosuid,nodev,mode=0750
      - /var/spool/squid:rw,noexec,nosuid,nodev,mode=0750
    volumes:
      - type: bind
        source: ${DIREXTALK_WORKER_EDGE_SQUID_CONFIG:?set the rendered Squid config path}
        target: /etc/squid/squid.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DIREXTALK_WORKER_EDGE_PROXY_TLS_CERT_FILE:?set the proxy TLS certificate path}
        target: /run/secrets/proxy-tls-cert.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DIREXTALK_WORKER_EDGE_PROXY_TLS_KEY_FILE:?set the proxy TLS private key path}
        target: /run/secrets/proxy-tls-key.pem
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker-edge:
    image: ${DIREXTALK_WORKER_EDGE_HAPROXY_IMAGE_IMMUTABLE:?set an immutable official HAProxy Alpine image reference}
    command: ["haproxy", "-W", "-db", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
      - /run:rw,noexec,nosuid,nodev,mode=0755
    volumes:
      - type: bind
        source: ${DIREXTALK_WORKER_EDGE_HAPROXY_CONFIG:?set the rendered Worker edge HAProxy config path}
        target: /usr/local/etc/haproxy/haproxy.cfg
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      worker-controlled-proxy:
        condition: service_healthy
